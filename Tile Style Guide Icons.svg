    .icon-stroke { fill: none; stroke: #1F2937; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .divider { stroke: #E5E7EB; stroke-width: 1; }
    .section-label { font-size: 11px; font-weight: 700; fill: #374151; letter-spacing: 0.04em; text-transform: uppercase; }
